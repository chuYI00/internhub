<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161c">
<title>烟草备考 · 手机手册</title>
<style>
:root{
  --bg:#0f1319; --bg2:#161b23; --card:#1b212b; --card2:#222935;
  --tx:#e8edf4; --tx2:#a3b0c2; --tx3:#6d7c90;
  --line:#2b3441; --acc:#4a9eff; --acc2:#0f2a45;
  --ok:#31c46b; --warn:#ffb020; --bad:#ff5d5d;
  --r:14px; --nav:calc(58px + env(safe-area-inset-bottom));
}
html[data-theme="light"]{
  --bg:#f2f4f7; --bg2:#fff; --card:#fff; --card2:#f7f9fb;
  --tx:#1a2230; --tx2:#5a6879; --tx3:#93a0b0;
  --line:#e3e8ef; --acc:#1e6fd9; --acc2:#e8f1fd;
  --ok:#17a34a; --warn:#c77700; --bad:#d63b3b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:var(--nav); overflow-x:hidden;
}
img{max-width:100%}
a{color:var(--acc);text-decoration:none}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.5px}
h1 small{display:block;font-size:11px;color:var(--tx3);font-weight:400;letter-spacing:0}
.iconbtn{
  width:34px;height:34px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);border-radius:10px;font-size:16px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto
}
#search{
  width:100%;margin-top:9px;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px
}
#search::placeholder{color:var(--tx3)}

/* ---------- 主体 ---------- */
main{padding:12px 12px 24px;max-width:640px;margin:0 auto}
.page{display:none;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.sec{font-size:12px;color:var(--tx3);margin:18px 2px 8px;font-weight:600;letter-spacing:1px}
.sec:first-child{margin-top:4px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden
}
.card>summary{
  padding:13px 14px;font-size:15px;font-weight:600;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:8px;user-select:none
}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;color:var(--tx3);font-size:12px;transition:.2s}
.card[open]>summary::after{transform:rotate(180deg)}
.card>summary .tag{
  font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;
  background:var(--acc2);color:var(--acc);margin-left:auto;flex:0 0 auto
}
.card[open]>summary .tag{display:none}
.card[open]>summary .chips{display:none}
.card>summary .done{font-size:13px;flex:0 0 auto}
.body{padding:0 14px 14px;font-size:14px;color:var(--tx2)}
.body p{margin:8px 0}
.body b,.body strong{color:var(--tx)}
.body ul{margin:6px 0;padding-left:20px}
.body li{margin:5px 0}
.body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.body td,.body th{border:1px solid var(--line);padding:7px 8px;text-align:left}
.body th{background:var(--card2);color:var(--tx)}
.hl{color:var(--warn);font-weight:600}
.red{color:var(--bad);font-weight:600}
.grn{color:var(--ok);font-weight:600}
.k{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:7px 0;font-size:13.5px;color:var(--tx)}
.k b{color:var(--acc)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}

/* ---------- 分层标签 🔴🟡🔵 ---------- */
.lv{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:0;margin-right:5px;white-space:nowrap}
.lv-c{color:#ff7373;background:rgba(255,115,115,.15)}
.lv-y{color:#ffc247;background:rgba(255,194,71,.15)}
.lv-b{color:#79bdff;background:rgba(121,189,255,.15)}
html[data-theme="light"] .lv-c{color:#c62828;background:rgba(198,40,40,.10)}
html[data-theme="light"] .lv-y{color:#a35c00;background:rgba(163,92,0,.10)}
html[data-theme="light"] .lv-b{color:#1e6fd9;background:rgba(30,111,217,.10)}
.chips{font-size:10.5px;color:var(--tx3);flex:0 0 auto;letter-spacing:.3px}

/* 拓展选学折叠块 */
.ext{margin-top:10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg2)}
.ext>summary{padding:9px 11px;font-size:12.5px;color:var(--tx3);cursor:pointer;list-style:none;user-select:none}
.ext>summary::-webkit-details-marker{display:none}
.ext[open]>summary{color:var(--tx2)}
.ext .body{padding:0 12px 10px;font-size:13px}

/* 模式切换 */
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font-size:12.5px;padding:8px 6px;border-radius:9px;cursor:pointer;line-height:1.35}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.seg button small{display:block;font-size:10px;opacity:.85;font-weight:400;margin-top:2px}

/* 微课指引行 */
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.mc.done{opacity:.6}
.mc-h{font-size:14.5px;font-weight:600;color:var(--tx);display:flex;gap:7px;align-items:flex-start}
.mc-h .no{font-size:11px;color:var(--tx3);flex:0 0 auto;padding-top:3px}
.mc-h .cx{flex:1}
.mcbox{width:20px;height:20px;flex:0 0 auto;border:2px solid var(--tx3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.mc.done .mcbox{background:var(--ok);border-color:var(--ok);color:#fff}
.mc-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.mc-k{font-size:11.5px;color:var(--tx3);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.mc-g{font-size:13px;color:var(--tx2);margin-top:7px;line-height:1.6}
.mc-g b{color:var(--tx)}
.copy{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--acc);background:var(--acc2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}

/* 个人刷题总结 */
.mynote{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.mytitle{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:3px}
.note{width:100%;min-height:62px;margin-top:2px;padding:9px 10px;border-radius:9px;border:1px dashed var(--line);background:var(--card2);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC",sans-serif;resize:vertical}
.note::placeholder{color:var(--tx3)}
.notehint{font-size:11px;color:var(--tx3);margin-top:4px}

/* 今日任务勾选 */
.task{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer}
.task:active{background:var(--card2)}
.task .box{
  width:21px;height:21px;flex:0 0 auto;border:2px solid var(--tx3);border-radius:6px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent
}
.task.ck .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.ck .t1{text-decoration:line-through;color:var(--tx3)}
.t1{font-size:14.5px;color:var(--tx);font-weight:500}
.t2{font-size:12px;color:var(--tx3);margin-top:2px}

/* 统计条 */
.hero{
  background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:10px
}
.hero .big{font-size:30px;font-weight:800;color:var(--acc);line-height:1.1}
.hero .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.stats{display:flex;gap:8px;margin-top:11px}
.stat{flex:1;background:var(--bg2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--tx)}
.stat span{font-size:10.5px;color:var(--tx3)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:.3s}

/* 底部导航 */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  flex:1;background:none;border:0;color:var(--tx3);padding:7px 0 6px;
  font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav button i{font-size:19px;font-style:normal;line-height:1}
nav button.on{color:var(--acc)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;
  z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.foot{text-align:center;font-size:11px;color:var(--tx3);padding:20px 0 6px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🍃 云南烟草备考手册<small id="sub">2027 届 · 中国民航大学 · 物联网工程</small></h1>
    <button class="iconbtn" id="theme" title="夜间/日间">🌙</button>
  </div>
  <input id="search" placeholder="🔍 搜知识点，比如「基期」「烟草专卖法」">
</header>

<main>
  <div class="page on" id="p-today"></div>
  <div class="page" id="p-course"></div>
  <div class="page" id="p-mem"></div>
  <div class="page" id="p-quiz"></div>
  <div class="page" id="p-major"></div>
  <div class="page" id="p-iv"></div>
  <div class="page" id="p-tips"></div>
  <div class="foot">以官方公告为准 · 本地文件，不联网<br>国家烟草专卖局人才招聘专栏 tobacco.gov.cn</div>
</main>

<nav>
  <button data-p="today" class="on"><i>🗓</i>今日</button>
  <button data-p="course"><i>🎬</i>微课</button>
  <button data-p="mem"><i>🧠</i>必背</button>
  <button data-p="quiz"><i>✏️</i>刷题</button>
  <button data-p="major"><i>🔧</i>专业</button>
  <button data-p="iv"><i>💬</i>面试</button>
  <button data-p="tips"><i>⚠️</i>避坑</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============ 配置 ============ */
var EXAM = new Date(2026,11,15);              // 预估笔试日 2026-12-15（出公告后改这里）
var STAGES = [
  {s:new Date(2026,8,17),  e:new Date(2026,9,7),   n:"阶段一 · 基础速成", h:"2 小时", d:"建手感 + 过一遍公基"},
  {s:new Date(2026,9,8),   e:new Date(2026,9,31),  n:"阶段二 · 强化刷题", h:"2 小时", d:"限时成组刷 + 专业科目"},
  {s:new Date(2026,10,1),  e:new Date(2027,0,31),  n:"阶段三 · 模考冲刺", h:"2 小时", d:"整卷模考 + 只刷错题"}
];

/* 今日任务（按阶段切换） */
var TASKS = {
  0:[
    ["资料分析","背一遍公式表 + 2 篇材料 10 题 · 30 分钟","目标正确率 75%，每题 ≤60 秒"],
    ["判断推理","图推 20 题 + 逻辑公式背 1 遍 · 25 分钟","40 秒没思路立刻跳过"],
    ["言语理解","片段 10 题 + 选词 5 题 · 15 分钟","保语感，不抠难题"],
    ["公基背诵","省情 / 烟草 / 公文 / 法律 按天轮换 · 40 分钟","见「必背」页，点开读一遍"],
    ["错题复盘","当天错的当天看 · 10 分钟","同类错 2 次标为重点"]
  ],
  1:[
    ["行测限时","资料 / 判断 / 言语 成组掐表 · 70 分钟","一组一组掐，别散着刷"],
    ["专业科目","电路 / 数电 / 单片机 / 计网 轮换 · 30 分钟","见「专业」页清单"],
    ["公基滚动","背诵 + 刷题 · 20 分钟","云南时政每天扫一眼"]
  ],
  2:[
    ["整卷模考","隔天 1 套，限时做完 · 120 分钟","练「难题直接跳过」"],
    ["时政与申论","云南时政 + 烟草动态 + 金句 · 20 分钟","学习强国 10 分钟"],
    ["只看错题","考前 5 天不学新内容","错题本每天过一遍"]
  ]
};

/* ============ 必背卡 ============ */
var MEM = [
{ id:"zl", t:"资料分析 · 六大概念与核心公式", tag:"行测", items:[
  ["c","<b>增长率</b> = 增长量 ÷ 基期 = 现期÷基期 − 1（「增幅、增速、增长 %」都是它，结果带 <b>%</b>）"],
  ["c","<b>增长量</b> = 现期 − 基期 = 现期 × r ÷ (1+r)（结果<b>带单位</b>：万吨、亿元）"],
  ["c","读题先判断求「率」还是求「量」：<b>问增长了多少→量</b>，<b>问增长百分之几→率</b>，这是最常套错的坑"],
  ["c","<b>基期量</b> = 现期 ÷ (1+r)；<b>|r| ≤ 5% 时用「化除为乘」</b>：基期 ≈ 现期 × (1−r)"],
  ["c","<b>现期量</b> = 基期 × (1+r)，隔 n 年 = 基期 × (1+r)ⁿ"],
  ["c","<b>比重</b> = 部分 ÷ 整体；反过来：<b>部分 = 整体×比重，整体 = 部分÷比重</b>"],
  ["c","<b>基期比重</b> = A/B × <b>(1+b)÷(1+a)</b>（A=部分现期、a=部分增速；B=整体现期、b=整体增速）"],
  ["c","<b>两期比重差</b> = A/B × (a−b)÷(1+a)；<b>判升降只看 a 与 b 谁大</b>（部分增速 &gt; 整体增速 → 比重<b>上升</b>）"],
  ["c","<b>平均数</b> = 总量 ÷ 份数；<b>平均数增长率</b> = (1+总量增速) ÷ (1+份数增速) − 1"],
  ["c","A 是 B 的几倍 = A÷B；A 比 B <b>多</b>几倍 = A÷B − 1"],
  ["c","<b>百分点 vs 百分数</b>：两个百分数相减用「<b class=\"red\">百分点</b>」（增速高 3 个百分点），不是 3%"],
  ["c","<b>混合增长率</b>：整体增速<b>介于两部分之间</b>，且更靠近<b>基数大</b>的那部分（定性判断即可）"],
  ["c","<b>年均增长率 ≈ (末期÷基期 − 1) ÷ n</b>（估算够用；精确值只比估算值略小，选项接近时选略小的）"],
  ["y","拉动增长率 = 部分增长量 ÷ 整体基期；增长贡献率 = 部分增长量 ÷ 整体增长量"],
  ["y","同比 = 与上年同期比；环比 = 与上一个统计周期比（环比<b>不是</b>同比的简称）"],
  ["y","发展速度 = 现期÷基期；增长速度 = 发展速度 − 1（增长速度就是增长率）"],
  ["y","翻 n 番 = 2ⁿ 倍；成数：三成 = 30%"]
], ext:[
  "年均增长率的<b>精确开方</b>解（如需用二分/代入排除代替，不必手算开方）",
  "隔年倍数、隔年基期的<b>多重嵌套</b>（先把隔年增长率算出来再套，不建议练）",
  "混合增长率的<b>十字交叉精确解方程</b>结果（用「偏向基数大的一侧」定性判断即可得分）",
  "三个及以上主体的多重混合持股比例题（烟草基本不考，直接跳过）"
]},
{ id:"suan", t:"资料分析 · 三大速算（提分命根子）", tag:"行测", items:[
  ["c","<b>截位直除</b>：一步除法只截<b>分母</b>（选项差距大截 3 位、差距小截 4 位），够选答案就行"],
  ["c","<b>特征数字法</b>（百化分，背到脱口而出）：1/7≈14.3%、1/9≈11.1%、1/11≈9.1%、1/12≈8.3%、1/13≈7.7%、1/14≈7.1%、1/15≈6.7%、1/16=6.25%、1/6≈16.7%、1/8=12.5%"],
  ["c","常用互化：50%=1/2、25%=1/4、<b>1/20=5%</b>、33%≈1/3、66%≈2/3、75%=3/4"],
  ["c","<b>同位比较法</b>：两个分数比大小——<b>分母挨得近就看分子，分子挨得近就看分母</b>，先看量级再看首位"],
  ["c","<b>差分法</b>：两分数同向变化时，用「分子差/分母差」的新分数与小的比，再判断谁大"],
  ["c","<b>放缩估算</b>：把 998 当 1000、把 10.2% 当 10%，<b>误差 &lt;5% 不影响选答案</b>"],
  ["c","<b>固定动作四步</b>：看问题（求啥）→ 定位数据（别找错行）→ 列式 → 截位估算 → 选<b>最接近</b>的一项"],
  ["y","首数法：选项首位不同，算出第一位就能选，不要再往下算"]
], ext:[
  "繁琐的错位相减、分数裂项求和（估算足以覆盖，练它性价比极低）",
  "需要手算开平方的真平均数/综合变形题"
]},
{ id:"tui", t:"图形推理 · 高频规律", tag:"行测", items:[
  ["c","<b>做题顺序</b>：先看<b>元素是否相同</b>——相同→优先想位置/遍历；不同→想属性/数量。<span class=\"red\">40 秒没思路立刻跳过</span>"],
  ["c","<b>位置类</b>：平移（步数/方向/路径、越界循环）、旋转（顺时针/逆时针+角度）、翻转（上下/左右）"],
  ["c","<b>样式类</b>：遍历（缺啥补啥）、叠加、<b>去同存异 / 去异存同</b>"],
  ["c","<b>属性类</b>：<b>对称性</b>（轴对称/中心对称、对称轴的数量与方向）、开闭性（全开/全闭/半开半闭）、曲直性"],
  ["c","<b>数量类</b>：点（交点/切点/十字点）、线（直线数、曲线数）、<b>面</b>、角、<b>素</b>（种类数与个数）"],

/* 阶段 */
function stageIdx(){
  var n=new Date(); n.setHours(0,0,0,0);
  for(var i=0;i<STAGES.length;i++){ if(n>=STAGES[i].s && n<=STAGES[i].e) return i; }
  if(n<STAGES[0].s) return 0;
  return STAGES.length-1;
}
/* 连续打卡：今天还没做就从昨天开始数，一直往前数到断的那天 */
function streak(){
  var n=0,d=new Date();
  if(dayN(fmt(d))===0) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    if(dayN(fmt(d))>0){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function copy(txt){
  var ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);ok=true} }catch(e){}
  if(!ok){
    try{
      var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");
      ta.style.position="fixed";ta.style.opacity=0;ta.style.top="0";
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
      ok=document.execCommand("copy");document.body.removeChild(ta);
    }catch(e){ok=false}
  }
  toast(ok?"已复制搜索词，去 B 站粘贴 ✅":"复制失败，长按搜索词自己复制");
}

  h+='<div class="sec">面试形式</div><div class="card"><div class="body">'+
    '<p>云南烟草以<b>结构化 / 半结构化</b>为主，技术岗可能加专业问答或实操。</p>'+
    '<p class="hl">笔试考完就要开始准备，<b>别等面试通知</b> —— 通知到面试通常只有几天。</p></div></div>';

}

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(function(p){p.classList.remove("on")});

/* 搜索 */
var allCards=[];
function reindex(){allCards=Array.prototype.slice.call(document.querySelectorAll(".card,.task,.mc"))}
reindex();
$("#search").oninput=function(){
  var q=this.value.trim().toLowerCase();
  if(!q){ allCards.forEach(function(c){c.classList.remove("hide")}); return; }
  allCards.forEach(function(c){
    var t=(c.textContent||"").toLowerCase();
    c.classList.toggle("hide", t.indexOf(q)<0);
    if(t.indexOf(q)>=0 && c.tagName==="DETAILS") c.open=true;
  });
};

/* 主题 */
var TH=get("ihub_theme","dark");
function applyTH(){
  document.documentElement.setAttribute("data-theme",TH);
  $("#theme").textContent = TH==="dark"?"☀️":"🌙";
  var mt=document.querySelector('meta[name=theme-color]');
  if(mt) mt.setAttribute("content",TH==="dark"?"#12161c":"#f2f4f7");
}
applyTH();
$("#theme").onclick=function(){TH=TH==="dark"?"light":"dark";set("ihub_theme",TH);applyTH()};

$("#sub").textContent="距笔试 "+Math.max(0,Math.ceil((EXAM-new Date())/86400000))+" 天 · 每天 2 小时就够";
