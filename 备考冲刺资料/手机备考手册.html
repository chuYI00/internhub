<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161c">
<title>烟草备考 · 手机手册</title>
<style>
:root{
  --bg:#0f1319; --bg2:#161b23; --card:#1b212b; --card2:#222935;
  --tx:#e8edf4; --tx2:#a3b0c2; --tx3:#6d7c90;
  --line:#2b3441; --acc:#4a9eff; --acc2:#0f2a45;
  --ok:#31c46b; --warn:#ffb020; --bad:#ff5d5d;
  --r:14px; --nav:calc(58px + env(safe-area-inset-bottom));
}
html[data-theme="light"]{
  --bg:#f2f4f7; --bg2:#fff; --card:#fff; --card2:#f7f9fb;
  --tx:#1a2230; --tx2:#5a6879; --tx3:#93a0b0;
  --line:#e3e8ef; --acc:#1e6fd9; --acc2:#e8f1fd;
  --ok:#17a34a; --warn:#c77700; --bad:#d63b3b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:var(--nav); overflow-x:hidden;
}
img{max-width:100%}
a{color:var(--acc);text-decoration:none}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.5px}
h1 small{display:block;font-size:11px;color:var(--tx3);font-weight:400;letter-spacing:0}
.iconbtn{
  width:34px;height:34px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);border-radius:10px;font-size:16px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto
}
#search{
  width:100%;margin-top:9px;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px
}
#search::placeholder{color:var(--tx3)}

/* ---------- 主体 ---------- */
main{padding:12px 12px 24px;max-width:640px;margin:0 auto}
.page{display:none;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.sec{font-size:12px;color:var(--tx3);margin:18px 2px 8px;font-weight:600;letter-spacing:1px}
.sec:first-child{margin-top:4px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden
}
.card>summary{
  padding:13px 14px;font-size:15px;font-weight:600;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:8px;user-select:none
}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;color:var(--tx3);font-size:12px;transition:.2s}
.card[open]>summary::after{transform:rotate(180deg)}
.card>summary .tag{
  font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;
  background:var(--acc2);color:var(--acc);margin-left:auto;flex:0 0 auto
}
.card[open]>summary .tag{display:none}
.card>summary .done{font-size:13px;flex:0 0 auto}
.body{padding:0 14px 14px;font-size:14px;color:var(--tx2)}
.body p{margin:8px 0}
.body b,.body strong{color:var(--tx)}
.body ul{margin:6px 0;padding-left:20px}
.body li{margin:5px 0}
.body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.body td,.body th{border:1px solid var(--line);padding:7px 8px;text-align:left}
.body th{background:var(--card2);color:var(--tx)}
.hl{color:var(--warn);font-weight:600}
.red{color:var(--bad);font-weight:600}
.grn{color:var(--ok);font-weight:600}
.k{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:7px 0;font-size:13.5px;color:var(--tx)}
.k b{color:var(--acc)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}

/* 今日任务勾选 */
.task{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer}
.task:active{background:var(--card2)}
.task .box{
  width:21px;height:21px;flex:0 0 auto;border:2px solid var(--tx3);border-radius:6px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent
}
.task.ck .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.ck .t1{text-decoration:line-through;color:var(--tx3)}
.t1{font-size:14.5px;color:var(--tx);font-weight:500}
.t2{font-size:12px;color:var(--tx3);margin-top:2px}

/* 统计条 */
.hero{
  background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:10px
}
.hero .big{font-size:30px;font-weight:800;color:var(--acc);line-height:1.1}
.hero .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.stats{display:flex;gap:8px;margin-top:11px}
.stat{flex:1;background:var(--bg2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--tx)}
.stat span{font-size:10.5px;color:var(--tx3)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:.3s}

/* 底部导航 */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  flex:1;background:none;border:0;color:var(--tx3);padding:7px 0 6px;
  font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav button i{font-size:19px;font-style:normal;line-height:1}
nav button.on{color:var(--acc)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;
  z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.foot{text-align:center;font-size:11px;color:var(--tx3);padding:20px 0 6px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🍃 云南烟草备考手册<small id="sub">2027 届 · 中国民航大学 · 物联网工程</small></h1>
    <button class="iconbtn" id="theme" title="夜间/日间">🌙</button>
  </div>
  <input id="search" placeholder="🔍 搜知识点，比如「基期」「烟草专卖法」">
</header>

<main>
  <div class="page on" id="p-today"></div>
  <div class="page" id="p-mem"></div>
  <div class="page" id="p-quiz"></div>
  <div class="page" id="p-major"></div>
  <div class="page" id="p-iv"></div>
  <div class="page" id="p-tips"></div>
  <div class="foot">以官方公告为准 · 本地文件，不联网<br>国家烟草专卖局人才招聘专栏 tobacco.gov.cn</div>
</main>

<nav>
  <button data-p="today" class="on"><i>🗓</i>今日</button>
  <button data-p="mem"><i>🧠</i>必背</button>
  <button data-p="quiz"><i>✏️</i>刷题</button>
  <button data-p="major"><i>🔧</i>专业</button>
  <button data-p="iv"><i>💬</i>面试</button>
  <button data-p="tips"><i>⚠️</i>避坑</button>
</nav>
<div class="toast" id="toast"></div>

<script>

  {s:new Date(2026,9,8),   e:new Date(2026,9,31),  n:"阶段二 · 强化刷题", h:"2 小时", d:"限时成组刷 + 专业科目"},

/* ============ 工具 ============ */
function $(s){return document.querySelector(s)}
function el(t,h){var d=document.createElement(t);d.innerHTML=h;return d}
function LSK(d){return "ihub_study_"+d}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function get(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},1600)}

/* 阶段 */
function stageIdx(){
  var n=new Date(); n.setHours(0,0,0,0);
  for(var i=0;i<STAGES.length;i++){ if(n>=STAGES[i].s && n<=STAGES[i].e) return i; }
  if(n<STAGES[0].s) return 0;
  return STAGES.length-1;
}
/* 连续打卡 */
function streak(){
  var n=0,d=new Date();
  for(var i=0;i<400;i++){
    var k=LSK(fmt(d)), v=get(k,null);
    if(v && v.n){ n++; d.setDate(d.getDate()-1); } else { if(i===0){d.setDate(d.getDate()-1);continue} break; }
  }
  return n;
}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ============ 渲染 & 交互 ============ */
renderToday();renderMem();renderQuiz();renderMajor();renderIv();renderTips();

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(function(p){p.classList.remove("on")});
    $("#p-"+b.dataset.p).classList.add("on");
    window.scrollTo(0,0);
  };
});

/* 搜索 */
var allCards=[];
function reindex(){allCards=Array.prototype.slice.call(document.querySelectorAll(".card,.task"))}
reindex();
$("#search").oninput=function(){
  var q=this.value.trim().toLowerCase();
  if(!q){ allCards.forEach(function(c){c.classList.remove("hide")}); return; }
  allCards.forEach(function(c){
    var t=(c.textContent||"").toLowerCase();
    c.classList.toggle("hide", t.indexOf(q)<0);
    if(t.indexOf(q)>=0 && c.tagName==="DETAILS") c.open=true;
  });
};

/* 主题 */
var TH=get("ihub_theme","dark");
function applyTH(){
  document.documentElement.setAttribute("data-theme",TH);
  $("#theme").textContent = TH==="dark"?"☀️":"🌙";
  var mt=document.querySelector('meta[name=theme-color]');
  if(mt) mt.setAttribute("content",TH==="dark"?"#12161c":"#f2f4f7");
}
applyTH();
$("#theme").onclick=function(){TH=TH==="dark"?"light":"dark";set("ihub_theme",TH);applyTH()};

$("#sub").textContent="距笔试 "+Math.max(0,Math.ceil((EXAM-new Date())/86400000))+" 天 · 每天 2 小时就够";
</script>
