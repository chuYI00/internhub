<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>北森式网申模拟页（InternHub 网申助手自检用）</title>
<style>
  body { font: 14px/1.7 "Microsoft YaHei", sans-serif; margin: 0; background: #f0f2f5; color: #1f2328; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 24px 160px; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
  .ant-form-item { display: flex; align-items: flex-start; margin: 10px 0; }
  .ant-form-item-label { flex: 0 0 150px; text-align: right; padding-right: 12px; color: #333; }
  .ant-form-item-label label::after { content: "："; }
  .ant-form-item-control { flex: 1; }
  input, textarea { width: 320px; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 6px; font: inherit; }
  textarea { height: 60px; }
  .ant-select { position: relative; width: 320px; }
  .ant-select-selector { border: 1px solid #d9d9d9; border-radius: 6px; padding: 5px 8px; cursor: pointer; background: #fff; }
  .ant-select-dropdown { position: absolute; z-index: 999; background: #fff; border: 1px solid #d9d9d9;
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.15); width: 100%; margin-top: 2px; }
  .ant-select-item-option { padding: 6px 10px; cursor: pointer; }
  .ant-select-item-option:hover { background: #f5f5f5; }
  .ant-radio-group { display: flex; gap: 10px; }
  .ant-radio-wrapper { display: flex; align-items: center; gap: 5px; border: 1px solid #d9d9d9;
    border-radius: 6px; padding: 4px 12px; cursor: pointer; background: #fff; }
  .ant-radio-wrapper.on { border-color: #1677ff; color: #1677ff; background: #e6f4ff; }
  .tip { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>北森（hotjob）式网申模拟页</h1>
  <div class="tip">
    这是 InternHub 网申助手的<b>自检页</b>：结构与北森一致（antd 自绘下拉 + 卡片单选）。
    装了 <code>网申助手.user.js</code> 后点右下角悬浮球 → 选岗位方向 → 「🚀 填入空字段」，
    再点本页下面的「算一下填充率」看结果。
  </div>
  <div class="card" id="form"></div>
  <button onclick="score()" style="padding:8px 16px">算一下填充率</button>
  <pre id="out" style="background:#fff;padding:12px;border-radius:8px"></pre>
</div>
<script>
/* 字段表：[题目, 类型, 选项?] —— 类型：text / textarea / select / radio */
var FIELDS = [
  ['姓名','text'], ['性别','radio',['男','女']], ['出生日期','text'],
  ['政治面貌','select',['中共党员','中共预备党员','共青团员','群众']],
  ['民族','text'], ['身份证号','text'], ['手机号码','text'], ['电子邮箱','text'],
  ['微信号','text'], ['QQ号码','text'],
  ['毕业院校','text'], ['所在学院','text'], ['所学专业','text'], ['专业类别','text'],
  ['最高学历','select',['大专','本科','硕士研究生','博士研究生']],
  ['学位','select',['学士','硕士','博士']], ['学制','text'], ['培养方式','text'],
  ['入学时间','text'], ['毕业时间','text'], ['GPA','text'], ['专业排名','text'],
  ['现居住地','text'], ['籍贯','select',['北京市','云南省','四川省','广东省']],
  ['高考省份','text'], ['户口性质','select',['农业户口','非农业户口']],
  ['通讯地址','text'], ['邮政编码','text'],
  ['外语水平','select',['CET-4','CET-6','无']], ['计算机等级','text'], ['普通话水平','text'],
  ['身高（cm）','text'], ['体重（kg）','text'], ['健康状况','text'],
  ['奖惩情况','textarea'], ['家庭主要成员','textarea'], ['婚姻状况','select',['未婚','已婚']],
  ['紧急联系人','text'], ['紧急联系人电话','text'], ['与本人关系','text'], ['紧急联系人地址','text'],
  ['是否有亲属在本单位工作','radio',['是','否']],
  ['求职意向','text'], ['期望工作城市','text'], ['期望薪资','text'], ['到岗时间','text'],
  ['是否服从调剂','radio',['是','否']], ['第一志愿','text'], ['信息来源','text'],
  ['兴趣爱好','text'], ['学生干部','text'], ['社会实践','textarea'],
  ['专业技能','textarea'], ['个人亮点','textarea'], ['项目经历','textarea'],
  ['自我评价','textarea'], ['获得证书','textarea'], ['奖学金/荣誉','textarea']
];

var host = document.getElementById('form');
FIELDS.forEach(function (f, i) {
  var item = document.createElement('div');
  item.className = 'ant-form-item';
  var lab = document.createElement('div');
  lab.className = 'ant-form-item-label';
  var l = document.createElement('label');
  l.textContent = f[0];
  lab.appendChild(l);
  var box = document.createElement('div');
  box.className = 'ant-form-item-control';
  var id = 'f' + i;

  if (f[1] === 'select') {
    var sel = document.createElement('div');
    sel.className = 'ant-select';
    sel.innerHTML = '<div class="ant-select-selector"><span class="v">请选择</span></div>';
    sel.addEventListener('click', function (e) {
      e.stopPropagation();
      if (sel._open) return;
      sel._open = true;
      var dd = document.createElement('div');
      dd.className = 'ant-select-dropdown';
      f[2].forEach(function (t) {
        var o = document.createElement('div');
        o.className = 'ant-select-item-option';
        o.textContent = t;
        o.addEventListener('click', function (ev) {
          ev.stopPropagation();
          sel.querySelector('.v').textContent = t;
          sel._val = t;
          dd.remove(); sel._open = false;
        });
        dd.appendChild(o);
      });
      sel.appendChild(dd);
    });
    box.appendChild(sel);
  } else if (f[1] === 'radio') {
    var g = document.createElement('div');
    g.className = 'ant-radio-group';
    f[2].forEach(function (t) {
      var w = document.createElement('div');
      w.className = 'ant-radio-wrapper';
      var r = document.createElement('div');
      r.setAttribute('role', 'radio');
      var s = document.createElement('span');
      s.textContent = t;
      r.appendChild(s); w.appendChild(r); g.appendChild(w);
      w.addEventListener('click', function () {
        g.querySelectorAll('.ant-radio-wrapper').forEach(function (x) { x.classList.remove('on'); });
        w.classList.add('on'); g._val = t;
      });
    });
    box.appendChild(g);
  } else {
    var inp = document.createElement(f[1] === 'textarea' ? 'textarea' : 'input');
    if (f[1] !== 'textarea') inp.type = 'text';
    inp.id = id; l.setAttribute('for', id);
    inp.placeholder = '请输入' + f[0];
    box.appendChild(inp);
  }
  item.appendChild(lab); item.appendChild(box); host.appendChild(item);
});

/* 填充率自检：数一数有多少控件被填上了 */
function score() {
  var total = 0, done = 0, miss = [];
  FIELDS.forEach(function (f, i) {
    if (f[1] === 'select' || f[1] === 'radio') {
      var g = host.querySelectorAll('.ant-form-item')[i].querySelector('.ant-select, .ant-radio-group');
      total++;
      if (g && g._val) done++; else miss.push(f[0]);
      return;
    }
    var el = document.getElementById('f' + i);
    total++;
    if (el && String(el.value || '').trim()) done++; else miss.push(f[0]);
  });
  var pct = Math.round(done / total * 100);
  document.getElementById('out').textContent =
    '填充率：' + done + '/' + total + ' = ' + pct + '%\n\n' +
    (miss.length ? '还没填上的（' + miss.length + '）：\n' + miss.join('、') : '全部填上了 ✅');
  window.__fillScore = { total: total, done: done, pct: pct, miss: miss };
}
</script>
</body>
</html>
